name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'نوع البناء (debug أو release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 استرجاع الكود (Checkout Code)
        uses: actions/checkout@v4

      - name: 🟢 إعداد Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ إعداد Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 📦 تثبيت مكتبات المشروع
        run: npm ci || npm install

      - name: 🧪 تشغيل الاختبارات الآلية
        run: npm test

      - name: 🏗️ بناء واجهة الويب (Vite Build)
        run: npm run build

      - name: 🔄 مزامنة مشروع أندرويد (Capacitor Sync)
        run: npx cap sync android

      - name: ⚙️ منح صلاحية التنفيذ لـ Gradle
        run: chmod +x android/gradlew

      - name: 📱 بناء ملف APK (Assemble Debug APK)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: 🔍 التحقق من توليد ملف APK
        run: |
          ls -lh android/app/build/outputs/apk/debug/
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: 🚀 رفع ملف APK كـ Artifact للتنزيل المباشر
        uses: actions/upload-artifact@v4
        with:
          name: Tunis-RFR-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 🏷️ إنشاء Release في GitHub عند وضع Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
